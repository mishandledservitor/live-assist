name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets: every automated test runs on fixtures (constitution III).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Builds come before Vitest so the privacy guard (tests/unit/privacy) scans the real build output.
      - run: pnpm build
      - run: pnpm build:e2e
      - run: pnpm test
        env:
          LIVE_ASSIST_REQUIRE_BUILD: '1'
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
